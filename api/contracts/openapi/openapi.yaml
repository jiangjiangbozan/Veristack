                  description: 回复内容
      responses:
        '200':
          description: 回复成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /objections/{objectionId}/resolve:
    parameters:
      - name: objectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 异议 ID
    post:
      tags: [Acceptance]
      summary: 关闭客户异议
      responses:
        '200':
          description: 关闭成功
          content:
