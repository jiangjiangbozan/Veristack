      responses:
        '200':
          description: 交付内容、清单与已有裁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /share/{token}/verification-code:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: 分享令牌明文
    post:
      tags: [Acceptance]
      summary: 申请客户邮箱验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: 验收人邮箱
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /share/{token}/verify:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: 分享令牌明文
    post:
      tags: [Acceptance]
      summary: 校验客户邮箱验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, email]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: 六位验证码
                email:
                  type: string
                  format: email
                  description: 验收人邮箱
      responses:
        '200':
          description: 验证通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /share/{token}/verdicts/{criterionKey}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: 分享令牌明文
      - name: criterionKey
        in: path
        required: true
        schema:
          type: string
        description: 验收条件稳定键
    post:
      tags: [Acceptance]
      summary: 保存单条验收裁定
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, verdict]
              properties:
                comment:
                  type: string
                  description: 裁定说明
                email:
                  type: string
                  format: email
                  description: 验收人邮箱
                verdict:
                  type: string
                  enum: [fail, pass]
                  description: 裁定结论
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /share/{token}/decision:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: 分享令牌明文
    post:
      tags: [Acceptance]
      summary: 客户提交最终验收结论
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, decision]
              properties:
                comment:
                  type: string
                  description: 总体说明
                decision:
                  type: string
                  enum: [approve, reject]
                  description: 验收结论
                email:
                  type: string
                  format: email
                  description: 验收人邮箱
                objections:
                  type: array
                  description: 客户提出的异议
                  items:
                    type: object
                    required: [criterionKey, comment]
                    properties:
                      criterionKey:
                        type: string
                        description: 验收条件稳定键
                      comment:
                        type: string
                        description: 异议内容
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /webhooks/{provider}/projects/{projectId}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [gitee, github, gitlab]
        description: 第三方平台
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 所属项目 ID
    post:
      tags: [Integration]
      summary: 接收第三方 Webhook 事件
      description: 先保存原始载荷再创建异步任务；GitHub 使用 HMAC-SHA256 签名校验，GitLab 与 Gitee 使用令牌校验。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 第三方平台的原始事件载荷
      responses:
        '200':
          description: 已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/{projectId}/webhooks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    get:
      tags: [Integration]
      summary: 列出收到的 Webhook 事件
      responses:
        '200':
          description: 事件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /projects/{projectId}/ci-reports:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    get:
      tags: [Integration]
      summary: 列出导入的 CI 报告
      responses:
        '200':
          description: 报告列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags: [Integration]
      summary: 导入 CI 测试报告
      description: 解析标准 JUnit XML，汇总通过、失败、跳过与耗时。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportXml]
              properties:
                buildNo:
                  type: string
                  description: 构建号
                deliveryId:
                  type: string
                  format: uuid
                  description: 关联交付版本 ID
                gitRef:
                  type: string
                  description: Git 提交或标签
                provider:
                  type: string
                  description: 来源平台
                reportXml:
                  type: string
                  description: JUnit XML 报告内容
      responses:
        '200':
          description: 导入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/ai/requirements:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Integration]
      summary: 从需求文档提取候选需求
      description: 产出为待确认草稿，不会自动写入需求基线。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: 原始需求文档
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /projects/{projectId}/ai/change-impact:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Integration]
      summary: 生成变更影响分析建议
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeRequestId]
              properties:
                changeRequestId:
                  type: string
                  format: uuid
                  description: 变更申请 ID
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /projects/{projectId}/ai/delivery-summary:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Integration]
      summary: 生成交付摘要建议
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryId]
              properties:
                deliveryId:
                  type: string
                  format: uuid
                  description: 交付版本 ID
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /projects/{projectId}/ai/suggestions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum: [change_impact, delivery_summary, requirement_extraction]
        description: 建议类型，留空返回全部
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    get:
      tags: [Integration]
      summary: 列出 AI 建议草稿
      responses:
        '200':
          description: 建议列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /ai/suggestions/{suggestionId}/apply:
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 建议 ID
    post:
      tags: [Integration]
      summary: 采纳 AI 建议
      description: 仅改变建议状态，不会自动改写正式基线或交付结论。
      responses:
        '200':
          description: 采纳成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /ai/suggestions/{suggestionId}/dismiss:
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 建议 ID
    post:
      tags: [Integration]
      summary: 忽略 AI 建议
      responses:
        '200':
          description: 忽略成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 注册或登录后获得的访问令牌

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 页码
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每页条数
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 项目 ID

  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
    TooManyRequests:
      description: 请求过于频繁，请稍后再试
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
    Unauthorized:
      description: 未认证或签名校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'

  schemas:
    Envelope:
      type: object
      required: [code, message, success]
      properties:
        code:
          type: string
          description: 业务错误码，成功时为空串
        data:
          description: 接口返回数据，结构随接口而定
        message:
          type: string
          description: 面向用户的提示信息
        page:
          $ref: '#/components/schemas/Page'
        success:
          type: boolean
          description: 是否成功

    AuditEvent:
      type: object
      required: [action, actorId, actorName, id, ip, objectId, objectType, occurredAt]
      properties:
        action:
          type: string
          description: 动作标识，例如 delivery.submit
        actorId:
          type: string
          description: 操作人 ID，系统操作时为空串
        actorName:
          type: string
          description: 操作人显示名称，用户已删除时为空串
        id:
          type: string
          format: uuid
          description: 审计事件 ID
        ip:
          type: string
          description: 来源 IP
        objectId:
          type: string
          format: uuid
          description: 被操作对象 ID
        objectType:
          type: string
          description: 被操作对象类型
        occurredAt:
          type: string
          format: date-time
          description: 发生时间（上海时区）

    AppError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 稳定错误码，例如 bad_request、unauthorized、not_found
        message:
          type: string
          description: 面向用户的可读信息

    Page:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总条数

    AuthResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 访问令牌
        user:
          $ref: '#/components/schemas/User'

    Notification:
      type: object
      required: [id, type, title, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 通知 ID
        type:
          type: string
          description: 事件类型
        title:
          type: string
          description: 通知标题
        body:
          type: string
          description: 通知正文
        link:
          type: string
          description: 站内跳转链接
        readAt:
          type: string
          format: date-time
          description: 阅读时间，未读为空
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        displayName:
          type: string
          description: 显示名称
        email:
          type: string
          format: email
          description: 邮箱
        emailVerifiedAt:
          type: string
          format: date-time
          description: 邮箱验证时间，未验证时为空
        id:
          type: string
          format: uuid
          description: 用户 ID
        organizationId:
          type: string
          format: uuid
          description: 所属组织 ID
        role:
          type: string
          enum: [admin, customer, developer, owner, reviewer]
          description: 用户角色
        status:
          type: string
          description: 账号状态

    RegisterRequest:
      type: object
      required: [displayName, email, organizationName, password]
      properties:
        displayName:
          type: string
          maxLength: 50
          description: 姓名
        email:
          type: string
          format: email
          maxLength: 120
          description: 邮箱
        organizationName:
          type: string
          maxLength: 80
          description: 组织名称
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 密码

    Project:
      type: object
      required: [id, name, status]
      properties:
        archived:
          type: boolean
          description: 是否归档
        clientName:
          type: string
          description: 客户名称
        contractNo:
          type: string
          description: 合同编号
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        description:
          type: string
          description: 项目描述
        endDate:
          type: string
          format: date
          description: 结束日期
        id:
          type: string
          format: uuid
          description: 项目 ID
        name:
          type: string
          description: 项目名称
        startDate:
          type: string
          format: date
          description: 开始日期
        status:
          type: string
          description: 项目状态
        updatedAt:
          type: string
          format: date-time
          description: 更新时间

    CreateProjectRequest:
      type: object
      required: [name, clientName]
      properties:
        clientName:
          type: string
          maxLength: 120
          description: 客户名称
        contractNo:
          type: string
          maxLength: 60
          description: 合同编号
        description:
          type: string
          maxLength: 2000
          description: 项目描述
        endDate:
          type: string
          format: date
          description: 结束日期
        name:
          type: string
          maxLength: 120
          description: 项目名称
        startDate:
          type: string
          format: date
          description: 开始日期

    ImportProjectRequest:
      type: object
      required: [project]
      properties:
        project:
          $ref: '#/components/schemas/CreateProjectRequest'
        requirements:
          type: array
          description: 初始需求列表，导入时冻结为 v1 基线
          items:
            $ref: '#/components/schemas/RequirementInput'
        milestones:
          type: array
          description: 可选的里程碑列表，用需求编号关联基线需求
          items:
            $ref: '#/components/schemas/ImportMilestone'

    ImportMilestone:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
          description: 里程碑名称
        requirementCodes:
          type: array
          description: 关联的需求编号
          items:
            type: string
            maxLength: 30
        targetDate:
          type: string
          format: date
          description: 目标完成日期

    ImportProjectResponse:
      type: object
      properties:
        milestoneCount:
          type: integer
          description: 已创建的里程碑数量
        project:
          $ref: '#/components/schemas/Project'
        requirementCount:
          type: integer
          description: 已创建的需求数量

    UpdateProjectRequest:
      allOf:
        - $ref: '#/components/schemas/CreateProjectRequest'
        - type: object
          required: [status]
          properties:
            archived:
              type: boolean
              description: 是否归档
            status:
              type: string
              enum: [active, completed, archived]
              description: 项目状态

    Member:
      type: object
      properties:
        displayName:
          type: string
          description: 显示名称
        email:
          type: string
          format: email
          description: 邮箱
        id:
          type: string
          format: uuid
          description: 用户 ID
        role:
          type: string
          description: 项目角色

    ProjectOverview:
      type: object
      properties:
        baselineCount:
          type: integer
          description: 范围基线版本数
        changeRequestCount:
          type: integer
          description: 变更申请数
        milestoneCount:
          type: integer
          description: 里程碑数
        requirementCount:
          type: integer
          description: 最新基线需求数

    Requirement:
      type: object
      properties:
        acceptanceCriteria:
          type: array
          items:
            type: string
          description: 验收条件
        code:
          type: string
          description: 需求编号
        description:
          type: string
          description: 需求描述
        id:
          type: string
          format: uuid
          description: 需求 ID
        priority:
          type: string
          enum: [high, low, medium]
          description: 优先级
        status:
          type: string
          description: 需求状态
        title:
          type: string
          description: 需求标题

    RequirementInput:
      type: object
      required: [code, title, priority]
      properties:
        acceptanceCriteria:
          type: array
          items:
            type: string
          description: 验收条件
        code:
          type: string
          maxLength: 30
          description: 需求编号
        description:
          type: string
          maxLength: 2000
          description: 需求描述
        priority:
          type: string
          enum: [high, low, medium]
          description: 优先级
        title:
          type: string
          maxLength: 200
          description: 需求标题

    Baseline:
      type: object
      properties:
        changeRequestId:
          type: string
          format: uuid
          description: 触发该版本的变更申请
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        frozenAt:
          type: string
          format: date-time
          description: 冻结时间
        id:
          type: string
          format: uuid
          description: 基线 ID
        projectId:
          type: string
          format: uuid
          description: 所属项目
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: 需求快照
        version:
          type: integer
          description: 版本号

    BaselineDiff:
      type: object
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: 新增需求
        modified:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: 修改需求
        removed:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: 删除需求

    ChangeRequest:
      type: object
      properties:
        baselineId:
          type: string
          format: uuid
          description: 来源基线
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        decidedAt:
          type: string
          format: date-time
          description: 决定时间
        id:
          type: string
          format: uuid
          description: 变更 ID
        impact:
          type: string
          description: 影响说明
        projectId:
          type: string
          format: uuid
          description: 所属项目
        reason:
          type: string
          description: 变更原因
        requesterId:
          type: string
          format: uuid
          description: 发起人
        status:
          type: string
          enum: [approved, pending, rejected]
          description: 状态
        type:
          type: string
          description: 变更类型

    CreateChangeRequest:
      type: object
      required: [reason, type, requirements]
      properties:
        impact:
          type: string
          maxLength: 2000
          description: 影响说明
        reason:
          type: string
          maxLength: 1000
          description: 变更原因
        requirements:
          type: array
          minItems: 1
          description: 拟议的需求调整
          items:
            type: object
            required: [code, title, priority, operation]
            properties:
              acceptanceCriteria:
                type: array
                items:
                  type: string
                description: 验收条件
              code:
                type: string
                description: 需求编号
              description:
                type: string
                description: 需求描述
              operation:
                type: string
                enum: [add, modify, remove]
                description: 调整方式
              priority:
                type: string
                enum: [high, low, medium]
                description: 优先级
              title:
                type: string
                description: 需求标题
        type:
          type: string
          enum: [add, modify, remove]
          description: 变更类型

security:
  - bearerAuth: []
