openapi: 3.1.0
info:
  title: Veristack API
  version: 1.0.0
  description: |
    验迹（Veristack）软件交付证据平台的 REST API 契约。

    资源层级：组织 → 项目 → 需求基线 / 变更申请 / 里程碑 / 交付版本 → 证据 / 验收。
    客户验收门户通过分享令牌访问，无需登录。
  contact:
    name: Veristack
    url: https://github.com/jiangjiangbozan/Veristack
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
    description: 当前服务
tags:
  - name: System
    description: 健康检查
  - name: Auth
    description: 注册、登录与当前用户
  - name: Project
    description: 项目与项目成员
  - name: Scope
    description: 需求范围基线
  - name: Change
    description: 需求变更申请
  - name: Milestone
    description: 交付里程碑
  - name: Delivery
    description: 交付版本与交付清单
  - name: Evidence
    description: 交付证据
  - name: Acceptance
    description: 客户验收与异议闭环
  - name: Integration
    description: Webhook、CI 报告与 AI 建议
  - name: Notification
    description: 站内通知与未读状态

paths:
  /healthz:
    get:
      tags: [System]
      summary: 服务健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            description: 存活状态

  /readyz:
    get:
      tags: [System]
      summary: 服务就绪检查
      description: 检查数据库连通性，失败时返回 503，供容器编排判断是否可以接收流量。
      security: []
      responses:
        '200':
          description: 服务就绪
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            description: 就绪状态
        '503':
          description: 数据库暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /auth/register:
    post:
      tags: [Auth]
      summary: 注册组织并创建 owner 用户
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录并签发访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  description: 邮箱
                password:
                  type: string
                  description: 密码
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Auth]
      summary: 读取当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录并撤销此前签发的会话
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password:
    post:
      tags: [Auth]
      summary: 修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  description: 当前密码
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: 新密码
      responses:
        '200':
          description: 密码已更新，旧会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: 申请密码重置邮件
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: 注册邮箱
      responses:
        '200':
          description: 已受理；邮箱不存在时同样返回成功，避免枚举账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: 使用一次性令牌重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  description: 邮件中的一次性重置令牌
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: 新密码
      responses:
        '200':
          description: 密码已重置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/email/verification-code:
    post:
      tags: [Auth]
      summary: 为当前用户邮箱申请验证码
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/email/verify:
    post:
      tags: [Auth]
      summary: 提交邮箱验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: 6 位数字验证码
      responses:
        '200':
          description: 邮箱已验证
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications:
    get:
      tags: [Notification]
      summary: 分页列出当前用户的站内通知
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 通知列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/unread-count:
    get:
      tags: [Notification]
      summary: 查询未读通知数量
      responses:
        '200':
          description: 未读数量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read-all:
    post:
      tags: [Notification]
      summary: 把全部未读通知标记为已读
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    post:
      tags: [Notification]
      summary: 把一条通知标记为已读
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 已标记
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Project]
      summary: 分页列出组织下的项目
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Project'
    post:
      tags: [Project]
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          project:
                            $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/import:
    post:
      tags: [Project]
      summary: 导入已有项目、首版基线与里程碑
      description: 在同一个请求事务中创建项目、需求基线、需求与里程碑，任一校验失败都会整体回滚。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportProjectRequest'
      responses:
        '200':
          description: 导入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ImportProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Project]
      summary: 读取项目详情
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                            type: object
                            properties:
                              project:
                                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Project]
      summary: 更新项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          project:
                            $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Project]
      summary: 软删除项目
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /projects/{projectId}/overview:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Project]
      summary: 读取项目概览统计
      responses:
        '200':
          description: 概览统计
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectOverview'

  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Project]
      summary: 列出项目成员
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Member'
    post:
      tags: [Project]
      summary: 添加项目成员
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  description: 组织内用户邮箱
                role:
                  type: string
                  enum: [developer, reviewer]
                  description: 项目角色
      responses:
        '200':
          description: 添加成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          member:
                            $ref: '#/components/schemas/Member'

  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 要移除的组织用户 ID
    delete:
      tags: [Project]
      summary: 移除项目成员
      description: 仅组织 owner 可操作，不能移除项目创建者。
      responses:
        '200':
          description: 移除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean

  /projects/{projectId}/scope-baselines:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Scope]
      summary: 列出需求范围基线
      responses:
        '200':
          description: 基线列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags: [Scope]
      summary: 创建并冻结需求基线
      description: 冻结后的基线不可编辑，后续调整必须通过变更申请生成新版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requirements]
              properties:
                requirements:
                  type: array
                  minItems: 1
                  description: 需求条目
                  items:
                    $ref: '#/components/schemas/RequirementInput'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /scope-baselines/{baselineId}:
    parameters:
      - name: baselineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 基线 ID
    get:
      tags: [Scope]
      summary: 读取基线详情
      responses:
        '200':
          description: 基线详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /scope-baselines/{baselineId}/diff:
    parameters:
      - name: baselineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 基准基线 ID
      - name: against
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: 对比基线 ID
    get:
      tags: [Scope]
      summary: 对比两个需求基线
      responses:
        '200':
          description: 差异结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /projects/{projectId}/change-requests:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    get:
      tags: [Change]
      summary: 分页列出变更申请
      responses:
        '200':
          description: 变更列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags: [Change]
      summary: 发起变更申请
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChangeRequest'
      responses:
        '200':
          description: 发起成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /change-requests/{changeId}:
    parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 变更申请 ID
    get:
      tags: [Change]
      summary: 读取变更申请详情
      responses:
        '200':
          description: 变更详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /change-requests/{changeId}/decision:
    parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 变更申请 ID
    post:
      tags: [Change]
      summary: 客户确认或拒绝变更申请
      description: 批准时在同一事务内生成新的范围基线版本，旧版本保持只读。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                  description: 决定
                comment:
                  type: string
                  description: 决定意见
      responses:
        '200':
          description: 处理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /projects/{projectId}/milestones:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Milestone]
      summary: 列出里程碑
      responses:
        '200':
          description: 里程碑列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags: [Milestone]
      summary: 创建里程碑
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 里程碑名称
                requirementIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: 关联需求 ID
                targetDate:
                  type: string
                  format: date
                  description: 目标日期
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /milestones/{milestoneId}:
    parameters:
      - name: milestoneId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 里程碑 ID
    get:
      tags: [Milestone]
      summary: 读取里程碑详情
      responses:
        '200':
          description: 里程碑详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    put:
      tags: [Milestone]
      summary: 更新里程碑
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, status]
              properties:
                name:
                  type: string
                  description: 里程碑名称
                requirementIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: 关联需求 ID
                status:
                  type: string
                  enum: [completed, pending, in_progress]
                  description: 里程碑状态
                targetDate:
                  type: string
                  format: date
                  description: 目标日期
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    delete:
      tags: [Milestone]
      summary: 软删除里程碑
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /projects/{projectId}/deliveries:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Delivery]
      summary: 列出交付版本
      responses:
        '200':
          description: 交付列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags: [Delivery]
      summary: 创建交付版本并冻结清单
      description: 清单在创建时即冻结，生成 SHA-256 摘要，后续不可覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baselineVersion, version]
              properties:
                baselineVersion:
                  type: integer
                  minimum: 1
                  description: 来源需求基线版本
                buildNo:
                  type: string
                  description: 构建号
                gitRef:
                  type: string
                  description: Git 提交或标签
                milestoneIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: 关联里程碑 ID
                version:
                  type: integer
                  minimum: 1
                  description: 交付版本号
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /deliveries/{deliveryId}:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 交付版本 ID
    get:
      tags: [Delivery]
      summary: 读取交付详情
      responses:
        '200':
          description: 交付详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /deliveries/{deliveryId}/manifest:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 交付版本 ID
    get:
      tags: [Delivery]
      summary: 读取交付清单快照
      responses:
        '200':
          description: 交付清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /deliveries/{deliveryId}/submit:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 交付版本 ID
    post:
      tags: [Delivery]
      summary: 提交客户验收
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /deliveries/{deliveryId}/pack:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 交付版本 ID
    post:
      tags: [Delivery]
      summary: 导出 Evidence Pack
      description: 把交付清单与证据附件打包为独立快照，返回 exportId 与下载地址；配置签名私钥时附带 Ed25519 签名。
      responses:
        '200':
          description: 导出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /deliveries/{deliveryId}/audit-events:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 交付版本 ID
    get:
      tags: [Delivery]
      summary: 列出交付操作审计时间线
      description: 返回交付生命周期与客户分享动作的审计事件，按发生时间倒序；单个交付的事件数量有界，不分页。
      responses:
        '200':
          description: 审计事件列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/AuditEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  /deliveries/{deliveryId}/packs/{exportId}/download:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 交付版本 ID
      - name: exportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 导出编号，由导出接口返回
    get:
      tags: [Delivery]
      summary: 下载 Evidence Pack ZIP
      description: 把指定导出快照流式打包为 ZIP，需携带访问令牌；历史导出互不覆盖，必须按导出编号下载。
      responses:
        '200':
          description: ZIP 文件
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /deliveries/{deliveryId}/evidence:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 交付版本 ID
    get:
      tags: [Evidence]
      summary: 列出交付证据时间线
      responses:
        '200':
          description: 证据列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags: [Evidence]
      summary: 登记证据
      description: 提交 JSON 为人工说明型证据，提交 multipart 为附件上传。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type]
              properties:
                note:
                  type: string
                  description: 证据说明
                requirementId:
                  type: string
                  format: uuid
                  description: 关联需求 ID
                source:
                  type: string
                  description: 证据来源
                title:
                  type: string
                  description: 证据标题
                type:
                  type: string
                  enum: [ci_report, document, git_commit, manual, recording, screenshot, test_report]
                  description: 证据类型
          multipart/form-data:
            schema:
              type: object
              required: [title, type, file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 证据附件
                note:
                  type: string
                  description: 证据说明
                title:
                  type: string
                  description: 证据标题
                type:
                  type: string
                  description: 证据类型
      responses:
        '200':
          description: 登记成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /evidence/{evidenceId}/file:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 证据 ID
    get:
      tags: [Evidence]
      summary: 下载证据附件
      description: 仅返回已登记附件且属于当前组织的证据文件。
      responses:
        '200':
          description: 附件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/evidence:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Evidence]
      summary: 列出项目全部证据
      responses:
        '200':
          description: 证据列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /deliveries/{deliveryId}/share-token:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 交付版本 ID
    post:
      tags: [Acceptance]
      summary: 生成客户验收分享链接
      description: 明文令牌只在本次响应返回，数据库仅保存摘要。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 90
                  description: 链接有效期天数
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /deliveries/{deliveryId}/acceptance:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 交付版本 ID
    get:
      tags: [Acceptance]
      summary: 读取验收概览
      responses:
        '200':
          description: 验收概览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /objections/{objectionId}/replies:
    parameters:
      - name: objectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 异议 ID
    post:
