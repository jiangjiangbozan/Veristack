<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Veristack · 验迹</title>
  <desc id="heroDesc">Veristack 是独立于 Git、CI 与 Agent 平台的软件交付证据层。需求、变更、交付、验收全部可核验。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A111D" />
      <stop offset="0.55" stop-color="#0D1727" />
      <stop offset="1" stop-color="#111F33" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F7BFF" stop-opacity="0.34" />
      <stop offset="1" stop-color="#2F7BFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#20C9C0" stop-opacity="0.18" />
      <stop offset="1" stop-color="#20C9C0" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0H40M0 0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" />
    </pattern>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="34" />
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <circle cx="246" cy="34" r="260" fill="url(#glowA)" filter="url(#softBlur)" />
  <circle cx="1060" cy="330" r="220" fill="url(#glowB)" filter="url(#softBlur)" />

  <text x="80" y="50" fill="#6E8BB1" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" letter-spacing="3.4">OPEN SOURCE · SELF-HOSTED</text>

  <g transform="translate(80 76)">
    <rect width="92" height="92" rx="22" fill="#12243D" stroke="#2C5E96" stroke-width="1.2" />
    <rect x="9" y="9" width="74" height="74" rx="16" fill="#0D1B30" stroke="#234A77" stroke-width="1" />
    <path d="M46 15 L72 26 V46 C72 61 61 72 46 78 C31 72 20 61 20 46 V26 Z" fill="#2F7BFF" fill-opacity="0.14" stroke="#63A9FF" stroke-width="1.5" />
    <path d="M34 46 L42 54 L59 36" fill="none" stroke="#A9D3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="196" y="126" fill="#F4F8FF" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">Veristack</text>
  <text x="200" y="158" fill="#91A9C9" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500">验迹 · 软件交付证据层</text>

  <text x="80" y="240" fill="#DCE8F8" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="600" letter-spacing="0.2">需求 · 变更 · 交付 · 验收，全部可核验</text>
  <text x="80" y="272" fill="#6F87AA" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.8">AN INDEPENDENT EVIDENCE LAYER FOR SOFTWARE DELIVERY</text>

  <g transform="translate(780 64)">
    <rect width="340" height="232" rx="22" fill="#0C1726" fill-opacity="0.9" stroke="#294363" stroke-width="1.2" />
    <rect x="18" y="-1" width="304" height="1" fill="#3A5A80" fill-opacity="0.5" />
    <text x="24" y="30" fill="#7C95B7" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5">delivery-snapshot.v2</text>
    <circle cx="286" cy="26" r="4" fill="#6DD6A5" />
    <text x="296" y="30" fill="#7FD9B0" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="600">可核验</text>
    <path d="M24 46H316" stroke="#233B58" stroke-width="1" />

    <g transform="translate(24 64)">
      <rect width="292" height="42" rx="10" fill="#11233A" stroke="#223E5E" />
      <rect x="10" y="11" width="20" height="20" rx="5" fill="#1D4164" />
      <path d="M15 21L19 25L26 17" fill="none" stroke="#7FC1FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="42" y="11" width="116" height="7" rx="3.5" fill="#C5D8ED" />
      <rect x="42" y="25" width="78" height="5" rx="2.5" fill="#4A6584" />
      <rect x="228" y="14" width="48" height="16" rx="8" fill="#173F35" stroke="#2F6B58" />
      <text x="252" y="25" fill="#7FD9B0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">passed</text>
    </g>

    <g transform="translate(24 112)">
      <rect width="292" height="42" rx="10" fill="#11233A" stroke="#223E5E" />
      <rect x="10" y="11" width="20" height="20" rx="5" fill="#1D4164" />
      <path d="M15 21L19 25L26 17" fill="none" stroke="#7FC1FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="42" y="11" width="102" height="7" rx="3.5" fill="#C5D8ED" />
      <rect x="42" y="25" width="90" height="5" rx="2.5" fill="#4A6584" />
      <rect x="228" y="14" width="48" height="16" rx="8" fill="#173F35" stroke="#2F6B58" />
      <text x="252" y="25" fill="#7FD9B0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">signed</text>
    </g>

    <g transform="translate(24 160)">
      <rect width="292" height="36" rx="10" fill="#0F2A2B" stroke="#2A5757" />
      <circle cx="18" cy="18" r="4" fill="#6DD6A5" />
      <text x="31" y="22" fill="#A9E6CF" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">清单摘要与签名均通过</text>
      <text x="266" y="22" fill="#6F9B8F" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="9" text-anchor="end">SHA-256</text>
    </g>
  </g>

  <path d="M704 184 H752" stroke="#3F6D9E" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="4 5" />
  <circle cx="716" cy="184" r="3.5" fill="#66A8F5" />
</svg>
